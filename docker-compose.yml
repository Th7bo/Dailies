# Dokploy: create a "Compose" service pointing at this repo, set the env vars
# below in the Environment tab, and attach the domain to the `app` service on port 3000.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://dailies:${POSTGRES_PASSWORD}@db:5432/dailies
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL:-https://daily.th7bo.dev}
      AUTH_TRUST_HOST: "true"
      AUTH_DISCORD_ID: ${AUTH_DISCORD_ID}
      AUTH_DISCORD_SECRET: ${AUTH_DISCORD_SECRET}
      ADMIN_DISCORD_IDS: ${ADMIN_DISCORD_IDS:-}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dailies
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: dailies
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dailies"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
